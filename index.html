<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Evento</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>

    <h1 id="title">Tu Evento</h1>

    <div class="header-buttons">
        <button id="darkModeBtn">🌙</button>
        <button id="languageBtn">English</button>
        <button id="menuBtn">☰</button>
    </div>

</header>

<nav id="menu">
    <a id="home" href="#">Inicio</a>
    <a id="servicesLink" href="#">Servicios</a>
    <a id="contactLink" href="#">Contacto</a>
</nav>

<main>

    <section>

        <h2 id="servicesTitle">Servicios</h2>

        <article>
            <h3 id="service1Title">Alquiler de Vajillas</h3>
            <p id="service1Description">
                Contamos con vajillas para eventos pequeños y grandes.
            </p>
        </article>

        <article>
            <h3 id="service2Title">Servicio de Garzones</h3>
            <p id="service2Description">
                Personal capacitado para atender cualquier tipo de evento.
            </p>
        </article>

    </section>

    <section>

        <h2 id="contactTitle">Contacto</h2>

        <form>

            <label id="labelName" for="name">Nombre</label>
            <input type="text" id="name">

            <label id="labelEmail" for="email">Correo</label>
            <input type="email" id="email">

            <label id="labelPhone" for="phone">Teléfono</label>
            <input type="tel" id="phone">

            <label id="labelMessage" for="message">Mensaje</label>
            <textarea id="message" rows="5"></textarea>

            <button id="sendButton" type="submit">
                Enviar
            </button>

        </form>

    </section>

</main>

<footer>
    <p>&copy; 2026 Tu Evento</p>
</footer>

<script src="script.js"></script>

</body>
</html>
